<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>MELODIX — Enter the Music Universe</title>
<style>
:root{--bg:#080808;--panel:#12110e;--gold:#d6ad55;--gold2:#f3d58a;--muted:#b9b2a3;--line:rgba(214,173,85,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#4a3515 0,transparent 42%),var(--bg);color:#f8f4e9;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:15px 5vw;background:#080808df;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{background:none;border:0;color:#f8f4e9;font-weight:950;letter-spacing:.28em;font-size:1.15rem}.logo b{color:var(--gold)}.homebtn{background:#17140e;color:var(--gold2);border:1px solid var(--line);border-radius:30px;padding:9px 15px}
.progress{height:2px;background:#252017}.progress span{display:block;height:100%;background:linear-gradient(90deg,#8c6425,var(--gold2));width:10%;transition:width .4s}
main{max-width:1180px;margin:auto;padding:25px 5vw 75px}.view{display:none;animation:reveal .55s ease}.view.active{display:block}@keyframes reveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:850}
.hero{min-height:570px;display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;gap:22px;padding:25px 0 48px}.hero h1{font-size:clamp(3.2rem,8vw,6.6rem);letter-spacing:-.075em;line-height:.88;margin:18px 0}.hero h1 span{color:var(--gold2)}.hero p{color:var(--muted);max-width:390px;line-height:1.7;font-size:.95rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.goldbtn,.ghost{border-radius:30px;padding:13px 19px;font-weight:850}.goldbtn{border:0;color:#120e06;background:linear-gradient(120deg,#f4dc9b,#b88935);box-shadow:0 10px 35px #d6ad5530}.ghost{background:#17140e;border:1px solid var(--line);color:#f5e4b8}
.hero-art{height:490px;position:relative;perspective:1000px;display:grid;place-items:center}.hero-image{width:100%;height:100%;object-fit:cover;border-radius:32px;border:1px solid #d6ad5555;filter:contrast(1.08) saturate(.75);box-shadow:0 35px 90px #000;animation:float 6s ease-in-out infinite;transform-style:preserve-3d}.hero-art:after{content:"";position:absolute;inset:0;border-radius:32px;background:linear-gradient(90deg,#08080855,transparent 70%),linear-gradient(0deg,#08080899,transparent 55%);pointer-events:none}.hero-glow{position:absolute;width:70%;height:70%;border-radius:50%;background:#d6ad5524;filter:blur(65px);animation:pulse 4s ease-in-out infinite}.hero-stamp{position:absolute;z-index:2;bottom:22px;left:22px;border:1px solid #d6ad5566;background:#090806c9;backdrop-filter:blur(14px);padding:13px 16px;border-radius:15px;color:#f4e5bf;letter-spacing:.12em;font-size:.72rem}
@keyframes float{0%,100%{transform:translateY(0) rotateY(-3deg) rotateX(1deg)}50%{transform:translateY(-13px) rotateY(3deg) rotateX(-1deg)}}@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:.9;transform:scale(1.12)}}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:18px 0 18px;gap:12px}.section-head h2{font-size:clamp(1.8rem,4vw,2.8rem);margin:6px 0;letter-spacing:-.05em}.section-head p{font-size:.78rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;height:275px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#15120c;text-align:left;color:white;padding:0;isolation:isolate;transition:transform .35s,border-color .35s;transform-style:preserve-3d}.card:hover{transform:translateY(-7px) rotateX(2deg);border-color:#e5c477}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.77;transition:transform .65s,filter .4s;filter:saturate(.72)}.card:hover img{transform:scale(1.08);filter:saturate(1)}.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#050505f5 0%,#05050512 80%),linear-gradient(130deg,#d6ad5518,transparent 55%)}.card .num{position:absolute;top:15px;left:16px;color:#f5d995;font-size:.68rem;letter-spacing:.18em;font-weight:900}.card .open{position:absolute;right:14px;top:12px;width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#090806a8;border:1px solid #d6ad5577;color:#f5d995}.card-copy{position:absolute;left:17px;right:15px;bottom:17px}.card h3{margin:0;font-size:1.2rem;letter-spacing:-.025em}.card p{margin:6px 0 0;color:#d2c9b5;font-size:.78rem;line-height:1.4;max-width:280px}
.topic-hero{height:390px;position:relative;border:1px solid var(--line);border-radius:27px;overflow:hidden;margin:8px 0 22px;display:flex;align-items:end;box-shadow:0 25px 70px #0008}.topic-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.75);animation:slowzoom 18s ease-in-out infinite alternate}.topic-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080808 0%,#08080812 80%),linear-gradient(90deg,#08080899,transparent)}@keyframes slowzoom{to{transform:scale(1.08)}}.topic-title{position:relative;z-index:2;padding:28px;max-width:740px}.topic-title h1{font-size:clamp(2.7rem,7vw,5rem);line-height:.94;letter-spacing:-.065em;margin:10px 0}.topic-title p{color:#e4dccb;max-width:560px;line-height:1.6}
.story{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}.story-card{background:linear-gradient(145deg,#19160f,#0f0e0b);border:1px solid var(--line);border-radius:21px;padding:22px}.story-card h2{font-size:1.35rem;margin:0 0 12px}.story-card p{color:var(--muted);line-height:1.75;font-size:.92rem}.story-card ul{padding-left:19px;color:#d0c7b5;line-height:1.9;font-size:.88rem}.visual{min-height:280px;border-radius:21px;overflow:hidden;border:1px solid var(--line);position:relative;transform-style:preserve-3d}.visual img{width:100%;height:100%;min-height:280px;object-fit:cover;transition:transform .7s;filter:saturate(.8)}.visual:hover img{transform:scale(1.07)}.visual:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 70px #0008;pointer-events:none}
.quickfacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.fact{flex:1;min-width:85px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#17140e}.fact strong{display:block;color:var(--gold2);font-size:1.05rem}.fact span{font-size:.7rem;color:var(--muted)}
.pagenav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.pagenav button{max-width:48%;text-align:left}.pagenav small{display:block;color:var(--gold);font-size:.62rem;letter-spacing:.16em;margin-bottom:5px}.footer{border-top:1px solid var(--line);padding:26px;text-align:center;color:#a79e8c;font-size:.75rem;letter-spacing:.1em}
@media(max-width:760px){main{padding:18px 17px 55px}.top{padding:13px 17px}.hero{grid-template-columns:1fr;min-height:0;padding:22px 0 38px}.hero-art{height:330px}.hero h1{font-size:clamp(3.4rem,15vw,5.2rem)}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{height:220px}.topic-hero{height:340px}.topic-title{padding:20px}.story{grid-template-columns:1fr}.visual,.visual img{min-height:230px}}
@media(max-width:390px){.cards{grid-template-columns:1fr}.card{height:235px}.hero-art{height:280px}.section-head{display:block}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><button class="logo" onclick="home()">MELO<b>D</b>IX</button><button class="homebtn" onclick="home()">⌂ &nbsp; HOME</button></header>
<div class="progress"><span id="bar"></span></div>
<main>
<section class="view active" id="homeView">
 <div class="hero">
  <div><div class="eyebrow">THE ART OF SOUND · EST. MELODIX</div><h1>FEEL THE<br><span>GOLDEN</span><br>NOTE.</h1><p>Explore the instruments, ideas and craft behind the music you love.</p><div class="actions"><button class="goldbtn" onclick="go(1)">ENTER THE WORLD ↗</button><button class="ghost" onclick="go(7)">MUSIC PRODUCTION</button></div></div>
  <div class="hero-art"><div class="hero-glow"></div><img class="hero-image" src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?auto=format&fit=crop&w=1400&q=90" alt="Guitar in a dramatic music studio"><div class="hero-stamp">✦ &nbsp; SOUND · ART · CREATION</div></div>
 </div>
 <div class="section-head"><div><div class="eyebrow">EXPLORE THE UNIVERSE</div><h2>Choose your chapter.</h2></div><p>10 WORLDS · ONE PASSION</p></div>
 <div class="cards" id="cards"></div>
</section>
<div id="pages"></div>
</main>
<footer class="footer">MELODIX &nbsp; ✦ &nbsp; FEEL THE MUSIC. CREATE YOUR SOUND.</footer>
<script>
const data=[
["Introduction to Music","The language behind every sound.","https://images.unsplash.com/photo-1507838153414-b4b713384a76?auto=format&fit=crop&w=1200&q=85","Music is sound shaped with intention. Rhythm, melody, harmony, tone and dynamics work together to create feeling and expression.",["Melody — a musical line of notes.","Rhythm — the pattern of sound and silence.","Harmony — notes sounding together.","Timbre — the unique colour of a sound."],[["5","Core elements"],["∞","Ways to express"],["1","Universal language"]]],
["Guitar World","Six strings. Endless possibilities.","https://images.unsplash.com/photo-1510915361894-db8b60106cb1?auto=format&fit=crop&w=1200&q=85","The guitar is a fretted string instrument. Strings vibrate to create notes; the body or pickups help project the sound.",["Acoustic, classical and electric guitar styles.","Body, neck, fretboard, bridge and tuning pegs.","Standard tuning: E – A – D – G – B – E.","Explore strumming, picking, slides and bends."],[["6","Typical strings"],["12","Semitones / octave"],["E–A–D–G–B–E","Standard tuning"]]],
["Piano & Keyboard","A universe of notes at your fingertips.","https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?auto=format&fit=crop&w=1200&q=85","Pianos create sound when hammers strike strings. Digital keyboards generate sound electronically and can recreate many instruments.",["Seven natural note names repeat across the keys.","Black keys form groups of two and three.","Chords combine multiple notes.","Octaves repeat the same note at a higher or lower pitch."],[["88","Standard piano keys"],["7","Natural notes"],["12","Notes / octave"]]],
["Drums & Rhythm","Feel the pulse. Find the groove.","https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?auto=format&fit=crop&w=1200&q=85","Drums and percussion give music its pulse, accents and energy. A drummer combines hands and feet to create patterns and fills.",["Beat — the pulse you tap along to.","Tempo — speed, measured in BPM.","Meter — how beats are grouped.","Kick, snare, hi-hat and toms build a drum kit."],[["BPM","Tempo unit"],["4/4","Common meter"],["Groove","Rhythmic feel"]]],
["Other Musical Instruments","Meet the voices of the orchestra.","https://images.unsplash.com/photo-1461360228754-6e81c478b882?auto=format&fit=crop&w=1200&q=85","Every instrument has its own voice. Strings vibrate, winds use moving air, brass uses buzzing lips and percussion is struck, shaken or scraped.",["Strings — violin, viola, cello and bass.","Woodwinds — flute, clarinet and oboe.","Brass — trumpet, horn and trombone.","Percussion — timpani, cymbals and shakers."],[["4","Main families"],["High–low","Pitch range"],["Many","Unique timbres"]]],
["Music Theory","See the patterns hidden in music.","https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1200&q=85","Music theory gives names to the patterns we hear. It helps musicians understand notes, intervals, scales, chords, rhythm and song structure.",["Notes represent musical pitches.","Intervals are distances between notes.","Scales organize notes into a sequence.","Chords combine notes to create harmony."],[["12","Pitch classes"],["Major / minor","Scale colours"],["I–IV–V","Common progression"]]],
["Music Production","From a spark of an idea to a finished track.","https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1200&q=85","Music production brings an idea to life. A digital audio workstation lets creators record, edit, arrange and mix audio or MIDI.",["Start with a mood, melody or musical idea.","Build a beat and layer instruments.","Record live performances or virtual instruments.","Arrange, mix and export your track."],[["DAW","Studio workspace"],["MIDI","Musical data"],["Mix","Balance the sound"]]],
["Sound Design & Effects","Sculpt sound. Create atmosphere.","https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=1200&q=85","Sound design creates or transforms audio. Synthesizers and effects shape texture, space, movement and character.",["Synthesis creates electronic tones.","EQ adjusts frequency balance.","Reverb creates a sense of space.","Delay repeats sound; distortion adds harmonics."],[["EQ","Tone shaping"],["Reverb","Space"],["Delay","Repeats"]]],
["Recording, Mixing & Mastering","The final polish behind every great track.","https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=1200&q=85","Recording captures a performance. Mixing balances tracks and mastering prepares the final mix for consistent playback.",["Choose the right microphone and room.","Set levels to avoid clipping.","Balance tracks with volume, panning and EQ.","Master the final mix for its release format."],[["Record","Capture"],["Mix","Balance"],["Master","Polish"]]]
];
const cards=document.getElementById("cards"),pages=document.getElementById("pages");
data.forEach((t,i)=>{let n=i+1;cards.insertAdjacentHTML("beforeend",`<button class="card" onclick="go(${n})"><img loading="lazy" src="${t[2]}" alt=""><span class="num">CHAPTER ${String(n+1).padStart(2,"0")}</span><span class="open">↗</span><span class="card-copy"><h3>${t[0]}</h3><p>${t[1]}</p></span></button>`);
pages.insertAdjacentHTML("beforeend",`<section class="view" id="p${n}"><div class="topic-hero"><img src="${t[2]}" alt="${t[0]}" loading="lazy"><div class="topic-title"><div class="eyebrow">MELODIX · CHAPTER ${String(n+1).padStart(2,"0")}</div><h1>${t[0]}</h1><p>${t[1]}</p></div></div><div class="story"><article class="story-card"><div class="eyebrow">THE ESSENCE</div><h2>${t[0]}</h2><p>${t[3]}</p><div class="eyebrow" style="margin-top:22px">DISCOVER</div><ul>${t[4].map(x=>`<li>${x}</li>`).join("")}</ul></article><div><div class="visual"><img src="${t[2]}" alt="${t[0]} visual" loading="lazy"></div><div class="quickfacts">${t[5].map(f=>`<div class="fact"><strong>${f[0]}</strong><span>${f[1]}</span></div>`).join("")}</div></div></div><div class="pagenav"><button class="ghost" onclick="${n===1?'home()':`go(${n-1})`}"><small>← PREVIOUS</small>${n===1?'HOME':data[i-1][0]}</button><button class="goldbtn" onclick="${n===9?'home()':`go(${n+1})`}"><small>NEXT CHAPTER →</small>${n===9?'BACK HOME':data[i+1][0]}</button></div></section>`)});
function go(n){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById("p"+n).classList.add("active");document.getElementById("bar").style.width=((n+1)*10)+"%";history.replaceState(null,"","#chapter-"+n);window.scrollTo({top:0,behavior:"smooth"})}
function home(){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById("homeView").classList.add("active");document.getElementById("bar").style.width="10%";history.replaceState(null,"",location.pathname);window.scrollTo({top:0,behavior:"smooth"})}
</script>
</body>
</html>
